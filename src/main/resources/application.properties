quarkus.quinoa.package-manager-install.node-version=20.10.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa

quarkus.http.port=8081

# Connessione al Database PostgreSQL (Core)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/core_db
quarkus.datasource.username=core_user
quarkus.datasource.password=core_password
quarkus.hibernate-orm.database.generation=update

# Integrazione Keycloak OIDC
